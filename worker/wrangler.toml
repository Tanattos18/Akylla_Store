# Akylla Shop — servidor de pagamentos (Cloudflare Worker)
# Publicar:  cd worker  →  npx wrangler deploy
# Segredos (uma vez):  npx wrangler secret put MP_ACCESS_TOKEN
#                      npx wrangler secret put MP_WEBHOOK_SECRET
#                      npx wrangler secret put GITHUB_TOKEN
#                      npx wrangler secret put CALLMEBOT_APIKEY   (aviso de vendas no WhatsApp)
name = "akylla-shop-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "Tanattos18/Akylla_Store"
GITHUB_BRANCH = "main"
ALLOWED_ORIGINS = "https://akyllashop.com,https://www.akyllashop.com,http://127.0.0.1:8765"
PAYMENT_MINUTES = "30"
# PIX manual: pedidos sem confirmação no painel depois deste prazo são cancelados e o estoque volta.
AUTO_CANCEL_HOURS = "48"
# Limite de pedidos PIX manual por aparelho (IP) por hora (evita travar o estoque de brincadeira).
MANUAL_ORDERS_PER_HOUR = "5"
# API do Mercado Pago: "orders" (Checkout Transparente via Orders) ou "payments" (legada).
MP_API = "orders"
# WhatsApp da loja que recebe o aviso de cada venda (DDI + DDD + número, só dígitos).
STORE_WHATSAPP = "556281517002"

# Pedidos e reservas de estoque. Crie com:  npx wrangler kv namespace create ORDERS
# e cole o "id" retornado abaixo.
[[kv_namespaces]]
binding = "ORDERS"
id = "55cbe78e467a40b2b084a1d3b1e3280c"

# Limpeza automática de pedidos não confirmados (de hora em hora).
[triggers]
crons = ["17 * * * *"]
